<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>今日四问 · 云端同步</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
            background: linear-gradient(145deg, #f5f0eb 0%, #e8e0d8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            margin: 0;
        }

        .app {
            background: rgba(255, 248, 242, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 32px 24px 36px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 16px 48px rgba(160, 130, 110, 0.12), 0 4px 12px rgba(160, 130, 110, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 242, 235, 0.4);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            min-height: 480px;
            position: relative;
        }

        /* ===== 登录面板 ===== */
        .login-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 20px 0 10px;
        }

        .login-panel h2 {
            font-size: 22px;
            color: #4a3f38;
            text-align: center;
        }

        .login-panel .sub {
            text-align: center;
            color: #b09a8a;
            font-size: 15px;
            margin-bottom: 8px;
        }

        .login-panel input {
            padding: 14px 18px;
            border-radius: 60px;
            border: 1.5px solid rgba(210, 190, 175, 0.25);
            background: rgba(255, 248, 242, 0.5);
            font-size: 16px;
            color: #4a3f38;
            outline: none;
            transition: border 0.2s ease;
            width: 100%;
        }

        .login-panel input:focus {
            border-color: #c9a8d4;
        }

        .login-panel input::placeholder {
            color: #cbb8aa;
        }

        .login-panel .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .login-panel .btn-group button {
            flex: 1;
            padding: 14px;
            border-radius: 60px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            border: none;
        }

        .login-panel .btn-group .btn-login {
            background: linear-gradient(135deg, #d4b8e0, #c9a8d4);
            color: white;
        }

        .login-panel .btn-group .btn-login:active {
            transform: scale(0.96);
        }

        .login-panel .btn-group .btn-register {
            background: rgba(210, 190, 175, 0.15);
            color: #6b5d52;
            border: 1.5px solid rgba(210, 190, 175, 0.2);
        }

        .login-panel .btn-group .btn-register:active {
            transform: scale(0.96);
        }

        .login-panel .error-msg {
            color: #d48a8a;
            font-size: 14px;
            text-align: center;
            min-height: 20px;
        }

        .login-panel .switch-mode {
            text-align: center;
            color: #b09a8a;
            font-size: 14px;
            cursor: pointer;
            margin-top: 4px;
        }

        .login-panel .switch-mode span {
            color: #8b6f9e;
            font-weight: 500;
        }

        /* ===== 用户信息栏 ===== */
        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 8px 12px 8px 18px;
            background: rgba(210, 190, 175, 0.08);
            border-radius: 60px;
        }

        .user-bar .username {
            font-size: 15px;
            color: #4a3f38;
            font-weight: 500;
        }

        .user-bar .logout-btn {
            background: transparent;
            border: 1px solid rgba(210, 190, 175, 0.2);
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 13px;
            color: #b09a8a;
            cursor: pointer;
            transition: 0.2s;
        }

        .user-bar .logout-btn:active {
            transform: scale(0.94);
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 2px dashed rgba(190, 170, 155, 0.2);
            flex-wrap: wrap;
            gap: 10px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #4a3f38;
            letter-spacing: 1px;
        }

        .header h1 .emoji {
            margin-right: 8px;
        }

        .header .date-badge {
            font-size: 15px;
            color: #b09a8a;
            background: rgba(210, 190, 175, 0.18);
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 450;
            white-space: nowrap;
        }

        /* ===== 问题列表 ===== */
        .question-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 28px;
        }

        .question-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            background: rgba(255, 248, 242, 0.5);
            border-radius: 60px;
            border: 1.5px solid rgba(210, 190, 175, 0.18);
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
            touch-action: manipulation;
        }

        .question-item:active {
            transform: scale(0.97);
            background: rgba(255, 248, 242, 0.7);
        }

        .check-ring {
            width: 34px;
            height: 34px;
            min-width: 34px;
            border-radius: 50%;
            border: 2.5px solid #d5c4b8;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: transparent;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .check-ring.done {
            border-color: #c9a8d4;
            background: linear-gradient(135deg, #e8d5f0 0%, #d4b8e0 100%);
            box-shadow: 0 4px 14px rgba(180, 140, 200, 0.3);
        }

        .check-ring.done::after {
            content: "✓";
            font-size: 20px;
            font-weight: 600;
            color: #8b6f9e;
            animation: pop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes pop {
            0% { transform: scale(0.4); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .question-text {
            font-size: 18px;
            font-weight: 470;
            color: #4a3f38;
            transition: all 0.3s ease;
            flex: 1;
            line-height: 1.4;
        }

        .question-text.done {
            color: #b09a8a;
            text-decoration: line-through;
            text-decoration-color: #cbb8aa;
            text-decoration-thickness: 2px;
        }

        /* ===== 进度 ===== */
        .progress-area {
            margin-bottom: 20px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(210, 190, 175, 0.2);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #d4b8e0, #c9a8d4);
            border-radius: 12px;
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .status-text {
            text-align: center;
            font-size: 16px;
            color: #b09a8a;
            letter-spacing: 0.4px;
            font-weight: 450;
        }

        .status-text .highlight {
            color: #8b6f9e;
            font-weight: 500;
        }

        /* ===== 日历 ===== */
        .calendar-panel {
            margin-top: 6px;
            padding-top: 22px;
            border-top: 2px dashed rgba(190, 170, 155, 0.18);
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform: translateY(12px);
        }

        .calendar-panel.open {
            max-height: 700px;
            opacity: 1;
            transform: translateY(0);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .calendar-header h2 {
            font-size: 19px;
            font-weight: 500;
            color: #4a3f38;
        }

        .calendar-header .nav-group {
            display: flex;
            gap: 6px;
        }

        .calendar-header .nav-group button {
            background: rgba(210, 190, 175, 0.12);
            border: none;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 15px;
            cursor: pointer;
            color: #6b5d52;
            transition: 0.2s;
        }

        .calendar-header .nav-group button:active {
            transform: scale(0.94);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
        }

        .day-name {
            font-size: 14px;
            font-weight: 500;
            color: #cbb8aa;
            padding: 6px 0 10px 0;
        }

        .day-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 40px;
            font-size: 17px;
            font-weight: 450;
            color: #4a3f38;
            background: rgba(255, 248, 242, 0.25);
            position: relative;
        }

        .day-cell.empty {
            background: transparent;
        }

        .day-cell.today {
            border: 2px solid #c9a8d4;
            background: rgba(210, 180, 220, 0.15);
            font-weight: 550;
        }

        .day-cell.marked {
            background: linear-gradient(135deg, #e8d5f0, #d4b8e0);
            color: #6b4f7a;
            font-weight: 550;
            box-shadow: 0 2px 12px rgba(180, 140, 200, 0.2);
        }

        .day-cell.marked::after {
            content: "✦";
            position: absolute;
            top: -2px;
            right: -2px;
            font-size: 13px;
            color: #b088c0;
        }

        /* ===== 底部按钮 ===== */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .footer .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .footer button {
            background: transparent;
            border: 1.5px solid rgba(210, 190, 175, 0.2);
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 15px;
            color: #b09a8a;
            cursor: pointer;
            transition: 0.25s;
        }

        .footer button:active {
            transform: scale(0.94);
        }

        .footer .export-btn {
            border-color: rgba(180, 140, 200, 0.3);
            color: #8b6f9e;
        }

        .footer .export-btn:hover {
            background: rgba(180, 140, 200, 0.08);
            border-color: rgba(180, 140, 200, 0.5);
        }

        /* ===== 弹窗 ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: rgba(255, 248, 242, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 32px 28px 28px;
            max-width: 460px;
            width: 100%;
            max-height: 80vh;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.12);
            animation: slideUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            flex-direction: column;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-box h2 {
            font-size: 22px;
            color: #4a3f38;
            margin-bottom: 4px;
        }

        .modal-box .sub {
            font-size: 15px;
            color: #b09a8a;
            margin-bottom: 18px;
        }

        .modal-box textarea {
            width: 100%;
            min-height: 220px;
            padding: 16px 18px;
            border-radius: 16px;
            border: 1.5px solid rgba(210, 190, 175, 0.25);
            background: rgba(255, 248, 242, 0.5);
            font-family: monospace;
            font-size: 15px;
            color: #4a3f38;
            resize: vertical;
            outline: none;
            line-height: 1.8;
        }

        .modal-box textarea:focus {
            border-color: #c9a8d4;
        }

        .modal-box .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 18px;
        }

        .modal-box .modal-actions button {
            padding: 10px 26px;
            border-radius: 40px;
            border: 1.5px solid rgba(210, 190, 175, 0.2);
            background: transparent;
            font-size: 16px;
            font-weight: 450;
            color: #6b5d52;
            cursor: pointer;
            transition: 0.25s;
        }

        .modal-box .modal-actions button:active {
            transform: scale(0.94);
        }

        .modal-box .modal-actions .btn-primary {
            background: linear-gradient(135deg, #d4b8e0, #c9a8d4);
            border-color: #c9a8d4;
            color: white;
        }

        .modal-box .modal-actions .btn-close {
            border-color: rgba(210, 190, 175, 0.3);
        }

        .modal-box .modal-actions .btn-close:hover {
            background: rgba(210, 190, 175, 0.08);
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(60, 50, 45, 0.85);
            backdrop-filter: blur(8px);
            color: #f5f0eb;
            padding: 12px 28px;
            border-radius: 60px;
            font-size: 16px;
            font-weight: 450;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 2000;
            pointer-events: none;
            white-space: nowrap;
            max-width: 90%;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 400px) {
            .app { padding: 22px 16px 26px; border-radius: 28px; }
            .header h1 { font-size: 20px; }
            .question-text { font-size: 16px; }
            .check-ring { width: 30px; height: 30px; min-width: 30px; }
            .day-cell { font-size: 15px; }
            .footer button { font-size: 13px; padding: 6px 14px; }
            .modal-box { padding: 22px 18px; }
            .modal-box textarea { min-height: 160px; font-size: 14px; }
        }

        @media (min-width: 421px) and (max-width: 768px) {
            .app { padding: 36px 30px 40px; max-width: 480px; }
            .question-text { font-size: 19px; }
            .check-ring { width: 38px; height: 38px; min-width: 38px; }
        }
    </style>
</head>
<body>

    <div class="toast" id="toast"></div>

    <div class="modal-overlay" id="exportModal">
        <div class="modal-box">
            <h2>📤 导出数据</h2>
            <p class="sub">📅 日期横排 · 完成状态 · 每月统计 · 年度汇总</p>
            <textarea id="exportText" readonly></textarea>
            <div class="modal-actions">
                <button class="btn-close" onclick="closeModal()">关闭</button>
                <button class="btn-primary" onclick="copyExportData()">📋 复制</button>
                <button class="btn-primary" onclick="downloadExportData()">⬇️ 下载</button>
            </div>
        </div>
    </div>

    <div class="app" id="app"></div>

    <script>
        // ============================================================
        //  今日四问 · UpStash Redis 云存储版
        //  已配置您的 UpStash 连接信息，直接使用
        // ============================================================

        // ============================================================
        //  ✅ 已填入您的 UpStash 连接信息
        // ============================================================
        const UPSTASH_URL = 'https://gorgeous-ghost-201940.upstash.io';
        const UPSTASH_TOKEN = 'gQAAAAAAAxTUAAIgcDJkMTBjNjA0ZDc5YjM0NDVlOTY4MzkyZGY4NWI3ODI5ZA';
        // ============================================================

        // -------- 工具 --------
        function pad(n) { return String(n).padStart(2, '0'); }

        function getTodayKey() {
            const d = new Date();
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
        }

        function getMonthInfo(year, month) {
            return {
                firstDay: new Date(year, month, 1).getDay(),
                daysInMonth: new Date(year, month + 1, 0).getDate()
            };
        }

        const TODAY = getTodayKey();

        // -------- 全局状态 --------
        let currentUser = null;
        let store = {};
        let viewYear = new Date().getFullYear();
        let viewMonth = new Date().getMonth();
        let isLoginMode = true;

        // -------- UpStash Redis 操作 --------
        async function redisCommand(command, ...args) {
            const response = await fetch(UPSTASH_URL, {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + UPSTASH_TOKEN,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify([command, ...args])
            });
            if (!response.ok) {
                throw new Error('Redis请求失败: ' + response.status);
            }
            const data = await response.json();
            return data.result;
        }

        // 获取用户数据
        async function getUserData(username) {
            try {
                const result = await redisCommand('GET', 'user:' + username);
                return result ? JSON.parse(result) : null;
            } catch (e) {
                console.error('获取用户数据失败:', e);
                return null;
            }
        }

        // 保存用户数据
        async function setUserData(username, data) {
            try {
                await redisCommand('SET', 'user:' + username, JSON.stringify(data));
                return true;
            } catch (e) {
                console.error('保存用户数据失败:', e);
                return false;
            }
        }

        // -------- Toast --------
        let toastTimer = null;

        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                el.classList.remove('show');
            }, 2200);
        }

        // -------- 弹窗 --------
        function openModal() {
            const modal = document.getElementById('exportModal');
            const textarea = document.getElementById('exportText');
            const data = store;

            const keys = Object.keys(data).filter(k => k.match(/^\d{4}-\d{2}-\d{2}$/)).sort();

            const monthMap = {};
            keys.forEach(key => {
                const ym = key.substring(0, 7);
                if (!monthMap[ym]) monthMap[ym] = [];
                monthMap[ym].push(key);
            });

            let lines = [];
            lines.push('📋 今日四问 · 打卡记录');
            lines.push('👤 用户: ' + (currentUser || '未登录'));
            lines.push('📅 导出: ' + new Date().toLocaleString());
            lines.push('━'.repeat(40));
            lines.push('');

            const sortedMonths = Object.keys(monthMap).sort();
            let totalDone = 0;
            let totalDays = 0;

            const currentYear = new Date().getFullYear();
            let yearDone = 0;
            let yearDays = 0;

            sortedMonths.forEach(ym => {
                const [year] = ym.split('-').map(Number);
                const dayKeys = monthMap[ym].sort();
                const monthName = year + '年' + ym.split('-')[1] + '月';
                lines.push(`📆 ${monthName}`);

                let statusLine = '  ';
                let monthDone = 0;
                dayKeys.forEach(key => {
                    const d = data[key];
                    const done = d && d.q1 && d.q2 && d.q3 && d.q4;
                    if (done) monthDone++;
                    const dayNum = key.split('-')[2];
                    const mark = done ? '✅' : '⬜';
                    statusLine += dayNum + mark + ' ';
                });
                lines.push(statusLine.trim());

                const total = dayKeys.length;
                const rate = total > 0 ? Math.round((monthDone / total) * 100) : 0;
                lines.push(`  ── 完成 ${monthDone}/${total} 天 (${rate}%)`);
                lines.push('');

                totalDone += monthDone;
                totalDays += total;

                if (year === currentYear) {
                    yearDone += monthDone;
                    yearDays += total;
                }
            });

            lines.push('━'.repeat(40));
            const overallRate = totalDays > 0 ? Math.round((totalDone / totalDays) * 100) : 0;
            lines.push(`📊 总计: ${totalDone}/${totalDays} 天完成 (${overallRate}%)`);

            const yearRate = yearDays > 0 ? Math.round((yearDone / yearDays) * 100) : 0;
            lines.push(`📅 ${currentYear}年: ${yearDone}/${yearDays} 天完成 (${yearRate}%)`);

            lines.push('');
            lines.push('📌 数据存储于 UpStash Redis 云端');

            textarea.value = lines.join('\n');
            modal.classList.add('active');
            textarea.scrollTop = 0;
        }

        function closeModal() {
            document.getElementById('exportModal').classList.remove('active');
        }

        document.getElementById('exportModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        function copyExportData() {
            const textarea = document.getElementById('exportText');
            navigator.clipboard.writeText(textarea.value).then(() => {
                showToast('✅ 已复制到剪贴板');
            }).catch(() => {
                textarea.select();
                document.execCommand('copy');
                showToast('✅ 已复制到剪贴板');
            });
        }

        function downloadExportData() {
            const textarea = document.getElementById('exportText');
            const blob = new Blob([textarea.value], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            const url = URL.createObjectURL(blob);
            a.href = url;
            a.download = `打卡记录_${TODAY}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('✅ 下载成功');
        }

        // -------- 云端数据操作 --------
        async function loadCloudData() {
            if (!currentUser) return;
            try {
                const userData = await getUserData(currentUser);
                if (userData && userData.data) {
                    const data = userData.data;
                    if (!data[TODAY]) data[TODAY] = { q1: false, q2: false, q3: false, q4: false };
                    store = data;
                } else {
                    store = { [TODAY]: { q1: false, q2: false, q3: false, q4: false } };
                    await saveCloudData();
                }
                render();
            } catch (e) {
                console.error('加载云端数据失败:', e);
                showToast('⚠️ 加载数据失败，请检查网络');
                const cached = localStorage.getItem('questCache_' + currentUser);
                if (cached) {
                    try {
                        store = JSON.parse(cached);
                        if (!store[TODAY]) store[TODAY] = { q1: false, q2: false, q3: false, q4: false };
                        render();
                    } catch (_) {}
                }
            }
        }

        async function saveCloudData() {
            if (!currentUser) return;
            try {
                await setUserData(currentUser, { data: store });
                localStorage.setItem('questCache_' + currentUser, JSON.stringify(store));
            } catch (e) {
                console.error('保存云端数据失败:', e);
                localStorage.setItem('questCache_' + currentUser, JSON.stringify(store));
                showToast('⚠️ 数据已保存在本地，联网后自动同步');
            }
        }

        // -------- 用户认证 --------
        async function handleLogin() {
            const username = document.getElementById('loginUser').value.trim();
            const password = document.getElementById('loginPass').value.trim();
            const errorEl = document.getElementById('loginError');

            if (!username || !password) {
                errorEl.textContent = '⚠️ 请填写用户名和密码';
                return;
            }

            errorEl.textContent = '⏳ 正在登录...';

            try {
                const userData = await getUserData(username);
                if (!userData) {
                    errorEl.textContent = '❌ 用户不存在，请先注册';
                    return;
                }
                if (userData.password !== password) {
                    errorEl.textContent = '❌ 密码错误';
                    return;
                }
                currentUser = username;
                showToast('✅ 登录成功！');
                await loadCloudData();
                render();
            } catch (e) {
                errorEl.textContent = '❌ ' + (e.message || '登录失败，请重试');
            }
        }

        async function handleRegister() {
            const username = document.getElementById('loginUser').value.trim();
            const password = document.getElementById('loginPass').value.trim();
            const errorEl = document.getElementById('loginError');

            if (!username || !password) {
                errorEl.textContent = '⚠️ 请填写用户名和密码';
                return;
            }
            if (password.length < 6) {
                errorEl.textContent = '⚠️ 密码至少6位';
                return;
            }

            errorEl.textContent = '⏳ 正在注册...';

            try {
                const existing = await getUserData(username);
                if (existing) {
                    errorEl.textContent = '❌ 用户名已存在';
                    return;
                }
                await setUserData(username, {
                    password: password,
                    data: { [TODAY]: { q1: false, q2: false, q3: false, q4: false } }
                });
                currentUser = username;
                store = { [TODAY]: { q1: false, q2: false, q3: false, q4: false } };
                showToast('🎉 注册成功！已自动登录');
                await saveCloudData();
                render();
            } catch (e) {
                errorEl.textContent = '❌ ' + (e.message || '注册失败，请重试');
            }
        }

        async function handleLogout() {
            currentUser = null;
            store = {};
            showToast('👋 已退出');
            render();
        }

        function toggleLoginMode() {
            isLoginMode = !isLoginMode;
            render();
        }

        // -------- 数据操作 --------
        function getTodayData() {
            return store[TODAY] || { q1: false, q2: false, q3: false, q4: false };
        }

        function allDone() {
            const d = getTodayData();
            return d.q1 && d.q2 && d.q3 && d.q4;
        }

        // -------- 渲染 --------
        function render() {
            const app = document.getElementById('app');

            if (!currentUser) {
                app.innerHTML = `
                    <div class="login-panel">
                        <h2>🌸 今日四问</h2>
                        <p class="sub">${isLoginMode ? '登录' : '注册'}后数据云端保存，永不丢失</p>
                        <input id="loginUser" type="text" placeholder="用户名" />
                        <input id="loginPass" type="password" placeholder="密码" />
                        <div class="error-msg" id="loginError"></div>
                        <div class="btn-group">
                            <button class="btn-login" onclick="handleLogin()">
                                ${isLoginMode ? '登录' : '注册'}
                            </button>
                            <button class="btn-register" onclick="toggleLoginMode()">
                                ${isLoginMode ? '注册新账号' : '返回登录'}
                            </button>
                        </div>
                        <div style="text-align:center;color:#cbb8aa;font-size:12px;margin-top:8px;">
                            🔒 数据加密存储于 UpStash Redis 云端
                        </div>
                    </div>
                `;
                document.getElementById('loginPass').addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        isLoginMode ? handleLogin() : handleRegister();
                    }
                });
                document.getElementById('loginUser').addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        document.getElementById('loginPass').focus();
                    }
                });
                return;
            }

            const todayData = getTodayData();
            const done = allDone();
            const total = 4;
            const completed = (todayData.q1 ? 1 : 0) + (todayData.q2 ? 1 : 0) + (todayData.q3 ? 1 : 0) + (todayData.q4 ? 1 : 0);
            const progress = (completed / total) * 100;

            const { firstDay, daysInMonth } = getMonthInfo(viewYear, viewMonth);
            const days = [];
            for (let i = 0; i < firstDay; i++) days.push(null);
            for (let d = 1; d <= daysInMonth; d++) {
                const key = viewYear + '-' + pad(viewMonth + 1) + '-' + pad(d);
                const isToday = key === TODAY;
                const dayData = store[key];
                const marked = dayData ? (dayData.q1 && dayData.q2 && dayData.q3 && dayData.q4) : false;
                days.push({ date: d, key, isToday, marked });
            }

            const monthNames = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];
            const questions = [
                { key: 'q1', label: '🌿 打八部金刚功了吗？' },
                { key: 'q2', label: '👁️ 揉眼睛了吗？' },
                { key: 'q3', label: '📖 学习了吗？' },
                { key: 'q4', label: '💡 想赚钱方法了吗？' }
            ];

            let html = '';

            html += `
                <div class="user-bar">
                    <span class="username">👤 ${currentUser}</span>
                    <button class="logout-btn" onclick="handleLogout()">退出</button>
                </div>
                <div class="header">
                    <h1><span class="emoji">🌸</span> 今日四问</h1>
                    <span class="date-badge">${TODAY}</span>
                </div>
            `;

            html += `<div class="question-list">`;
            questions.forEach(q => {
                const checked = todayData[q.key] || false;
                const ringClass = checked ? 'check-ring done' : 'check-ring';
                const textClass = checked ? 'question-text done' : 'question-text';
                html += `
                    <div class="question-item" data-key="${q.key}">
                        <div class="${ringClass}"></div>
                        <span class="${textClass}">${q.label}</span>
                    </div>
                `;
            });
            html += `</div>`;

            const statusEmoji = done ? '🌼' : '🌱';
            const statusMsg = done
                ? '🎉 全部完成！日历已为你点亮 ✦'
                : `完成 <span class="highlight">${Math.round(progress)}%</span> · 继续加油`;

            html += `
                <div class="progress-area">
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" style="width: ${progress}%;"></div>
                    </div>
                    <div class="status-text">
                        <span class="done-emoji">${statusEmoji}</span> ${statusMsg}
                    </div>
                </div>
            `;

            const panelOpenClass = done ? 'calendar-panel open' : 'calendar-panel';

            html += `<div class="${panelOpenClass}">`;
            html += `
                <div class="calendar-header">
                    <h2>📅 ${viewYear}年 ${monthNames[viewMonth]}</h2>
                    <div class="nav-group">
                        <button data-action="prev">‹</button>
                        <button data-action="today">今天</button>
                        <button data-action="next">›</button>
                    </div>
                </div>
                <div class="grid">
            `;

            ['日', '一', '二', '三', '四', '五', '六'].forEach(w => {
                html += `<div class="day-name">${w}</div>`;
            });

            days.forEach(cell => {
                if (cell === null) {
                    html += `<div class="day-cell empty"></div>`;
                } else {
                    let cls = 'day-cell';
                    if (cell.isToday) cls += ' today';
                    if (cell.marked) cls += ' marked';
                    html += `<div class="${cls}">${cell.date}</div>`;
                }
            });

            html += `</div>`;
            html += `
                <div class="footer">
                    <div class="btn-group">
                        <button data-action="reset">↻ 重置今日</button>
                        <button class="export-btn" data-action="export">📤 导出数据</button>
                    </div>
                </div>
            `;
            html += `</div>`;

            app.innerHTML = html;

            if (done) {
                app.classList.add('celebrate');
            } else {
                app.classList.remove('celebrate');
            }

            document.querySelectorAll('.question-item').forEach(el => {
                el.removeEventListener('click', handleQuestion);
                el.addEventListener('click', handleQuestion);
            });

            document.querySelectorAll('[data-action]').forEach(el => {
                el.removeEventListener('click', handleAction);
                el.addEventListener('click', handleAction);
            });

            saveCloudData();
        }

        // -------- 事件处理 --------
        function handleQuestion(e) {
            const el = e.currentTarget;
            const key = el.dataset.key;
            if (!key) return;
            const today = store[TODAY] || { q1: false, q2: false, q3: false, q4: false };
            today[key] = !today[key];
            store[TODAY] = today;
            render();
        }

        function handleAction(e) {
            const action = e.currentTarget.dataset.action;
            if (action === 'prev') {
                if (viewMonth === 0) { viewYear--; viewMonth = 11; } else { viewMonth--; }
                render();
            } else if (action === 'next') {
                if (viewMonth === 11) { viewYear++; viewMonth = 0; } else { viewMonth++; }
                render();
            } else if (action === 'today') {
                const d = new Date();
                viewYear = d.getFullYear();
                viewMonth = d.getMonth();
                render();
            } else if (action === 'reset') {
                store[TODAY] = { q1: false, q2: false, q3: false, q4: false };
                render();
                showToast('🔄 今日已重置');
            } else if (action === 'export') {
                openModal();
            }
        }

        // -------- 启动 --------
        render();
        console.log('🌸 今日四问已启动 · 数据存储于 UpStash');
        console.log('📅 今日:', TODAY);
    </script>
</body>
</html>
